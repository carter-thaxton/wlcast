# Cargo config for the static-gst feature. Use the alias, from the crate root:
#   PKG_CONFIG_PATH=<gst-full prefix>/lib/pkgconfig cargo static-gst
# (scripts/build-gst-full.sh builds the prefix; the binary lands in
# target/static/release/.)
#
# The gstreamer -sys crates find gst-full's own .pc files through
# PKG_CONFIG_PATH; these make them link those libraries statically.
# PipeWire and libva stay shared.
[env]
SYSTEM_DEPS_GLIB_2_0_LINK = "static"
SYSTEM_DEPS_GOBJECT_2_0_LINK = "static"
SYSTEM_DEPS_GIO_2_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_1_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_BASE_1_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_APP_1_0_LINK = "static"
