# Cargo config for the static-gst feature.  Use the alias, from the crate root:
#   scripts/build-gst-full.sh    # once; builds gst-full in target/gst-full
#   cargo static-gst             # binary in target/static/release/
# For a gst-full installed elsewhere, set PKG_CONFIG_PATH=<prefix>/lib/pkgconfig;
# an already-set PKG_CONFIG_PATH overrides the default below.
#
# The gstreamer -sys crates find gst-full's own .pc files through
# PKG_CONFIG_PATH; the LINK settings make them link those libraries
# statically.  PipeWire and libva stay shared.
[env]
# Relative to the crate root (cargo resolves it against the parent of the
# directory holding this file, i.e. of .cargo/).
PKG_CONFIG_PATH = { value = "target/gst-full/prefix/lib/pkgconfig", relative = true }
SYSTEM_DEPS_GLIB_2_0_LINK = "static"
SYSTEM_DEPS_GOBJECT_2_0_LINK = "static"
SYSTEM_DEPS_GIO_2_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_1_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_BASE_1_0_LINK = "static"
SYSTEM_DEPS_GSTREAMER_APP_1_0_LINK = "static"
